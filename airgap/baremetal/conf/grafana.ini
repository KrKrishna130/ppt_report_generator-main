# Grafana settings for the bare-metal stack. pptctl sets GF_PATHS_* to folders under var/.
[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[plugins]
plugin_admin_enabled = false
# Grafana 11 downloads grafana-lokiexplore-app from grafana.com at startup unless this is set.
preinstall_disabled = true
public_key_retrieval_disabled = true
